services:
  # host-mode `make e2e` only — `make e2e-k8s` runs its own in-cluster
  # Postgres/Redis/Redpanda/fake-gcs-server instead (see
  # k8s/templates/infra.yaml), so this file no longer needs a listener for
  # minikube pods to reach in on.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docpipeline
    ports:
      - "55432:5432"  # 5432/5433 already bound by pre-existing local postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.49
    command:
      - -scheme=http
      - -public-host=localhost:4443
      - -external-url=http://localhost:4443
      - -backend=memory
    ports:
      - "4443:4443"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 6379 is already bound by a pre-existing local redis

volumes:
  pgdata:
