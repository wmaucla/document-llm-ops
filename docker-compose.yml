services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092,PODS://0.0.0.0:9093
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092,PODS://host.minikube.internal:9093
    ports:
      - "9092:9092"
      - "9093:9093"  # step 9: same broker, advertised for minikube pods via host.minikube.internal
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docpipeline
    ports:
      - "55432:5432"  # 5432/5433 already bound by pre-existing local postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.49
    command:
      - -scheme=http
      - -public-host=localhost:4443
      - -external-url=http://localhost:4443
      - -backend=memory
    ports:
      - "4443:4443"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 6379 is already bound by a pre-existing local redis

volumes:
  pgdata:
