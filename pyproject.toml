[project]
name = "document-llm-ops"
version = "0.1.0"
description = "Local replication of the 100k docs/day document pipeline design — correctness core (v1)"
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]>=3.1",
  "confluent-kafka>=2.3",
  "google-cloud-storage>=2.16",
  "redis>=5.0",
  "pypdf>=4.2",
  "pdf2image>=1.17",
  "pytesseract>=0.3.10",
  "pydantic>=2.6",
  "reportlab>=4.1",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docpipeline"]
