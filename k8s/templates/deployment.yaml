{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docpipeline-{{ .name }}
  labels: {app: docpipeline-{{ .name }}}
  # Wave 1: after infra (wave -1) is healthy and migrate/topics/fixtures
  # (wave 0) have succeeded — schema and topics must exist before these
  # start. See templates/infra.yaml and templates/jobs.yaml.
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  replicas: {{ .replicas }}
  selector: {matchLabels: {app: docpipeline-{{ .name }}}}
  template:
    metadata: {labels: {app: docpipeline-{{ .name }}}}
    spec:
      {{- if .serviceAccountName }}
      # Only the GPU watchdog needs one (Kubernetes API access, see
      # templates/rbac.yaml); everything else runs as the namespace default.
      serviceAccountName: {{ .serviceAccountName }}
      {{- end }}
      containers:
      - name: {{ .name }}
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        command: {{ .command | toJson }}
        envFrom: [{configMapRef: {name: {{ $.Values.configMapName }}}}]
        resources:
          requests: {{ .resources.requests | toJson }}
          limits: {{ .resources.limits | toJson }}
        {{- if .metricsPort }}
        ports:
        - {containerPort: {{ .metricsPort }}, name: metrics}
        {{- end }}
        {{- if .livenessProbe }}
        # Freshness check on the heartbeat file docpipeline/infra/heartbeat.py
        # touches (see k8s/values.yaml's comment on this service for why).
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat 2>/dev/null || echo 0) )) -lt {{ .livenessProbe.staleSeconds }}
          initialDelaySeconds: 30
          periodSeconds: 30
          # 3, not 1: this container runs at a 500m CPU limit, and a single
          # throttled `sh`/`date`/`stat` exec must not be enough on its own to
          # kill a healthy consumer. Three consecutive failures is still only
          # 90s of extra tolerance on top of staleSeconds.
          failureThreshold: 3
        {{- end }}
{{- if .metricsPort }}
---
# Stable DNS name for Prometheus to scrape (templates/monitoring.yaml) — the
# Deployment alone gives every replica its own pod IP, not a fixed address.
apiVersion: v1
kind: Service
metadata:
  name: docpipeline-{{ .name }}-metrics
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  selector: {app: docpipeline-{{ .name }}}
  ports:
  - {port: {{ .metricsPort }}, targetPort: {{ .metricsPort }}, name: metrics}
{{- end }}
---
{{- end }}
