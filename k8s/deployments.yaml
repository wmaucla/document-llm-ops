---
# Fixed 2+ replicas, safe concurrently via SKIP LOCKED — see "Plus
# outbox-relay, which sits outside that [scaling] table because it scales on
# neither axis". On the critical path for every message; a
# PodDisruptionBudget would matter at real scale, skipped here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docpipeline-outbox-relay
  labels: {app: docpipeline-outbox-relay}
spec:
  replicas: 2
  selector: {matchLabels: {app: docpipeline-outbox-relay}}
  template:
    metadata: {labels: {app: docpipeline-outbox-relay}}
    spec:
      containers:
      - name: outbox-relay
        image: docpipeline:latest
        imagePullPolicy: Never
        command: ["python", "-m", "docpipeline.core.outbox"]
        envFrom: [{configMapRef: {name: docpipeline-config}}]
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 100m, memory: 128Mi}
---
