---
# Locally, this *is* the ingest path — see "Locally, the orphan detector is
# the ingest path" (fake-gcs-server has no bucket-notification wiring).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docpipeline-orphan-detector
  labels: {app: docpipeline-orphan-detector}
spec:
  replicas: 1
  selector: {matchLabels: {app: docpipeline-orphan-detector}}
