# One Deployment per consumer group — see the design doc's "Complete topic
# list" and "Topics vs deployments". image is built locally into minikube's
# docker daemon (`make image`), never pulled — imagePullPolicy: Never.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docpipeline-triage
  labels: {app: docpipeline-triage}
spec:
  replicas: 1
  selector: {matchLabels: {app: docpipeline-triage}}
  template:
    metadata: {labels: {app: docpipeline-triage}}
    spec:
      containers:
      - name: triage
        image: docpipeline:latest
        imagePullPolicy: Never
        command: ["python", "-m", "docpipeline.stages.triage"]
        envFrom: [{configMapRef: {name: docpipeline-config}}]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 200m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docpipeline-pdf-worker
  labels: {app: docpipeline-pdf-worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: docpipeline-pdf-worker}}
  template:
    metadata: {labels: {app: docpipeline-pdf-worker}}
    spec:
      containers:
      - name: pdf-worker
        image: docpipeline:latest
        imagePullPolicy: Never
        command: ["python", "-m", "docpipeline.stages.pdf_worker"]
        envFrom: [{configMapRef: {name: docpipeline-config}}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
# The ~900 CPU fleet in production, sized separately from pdf-worker for
# exactly the reason the design doc gives — see "Why not collapse further".
# KEDA scales this one on ocr.shard consumer lag (see keda.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docpipeline-ocr-shard
  labels: {app: docpipeline-ocr-shard}
spec:
  replicas: 1
  selector: {matchLabels: {app: docpipeline-ocr-shard}}
  template:
    metadata: {labels: {app: docpipeline-ocr-shard}}
    spec:
      containers:
      - name: ocr-shard
        image: docpipeline:latest
        imagePullPolicy: Never
        command: ["python", "-m", "docpipeline.stages.ocr_shard"]
        envFrom: [{configMapRef: {name: docpipeline-config}}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 200m, memory: 256Mi}
---
