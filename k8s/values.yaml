# image is built locally into minikube's docker daemon (`make image`), never
# pulled — imagePullPolicy: Never.
image:
  repository: docpipeline
  tag: latest
  pullPolicy: Never

configMapName: docpipeline-config

# Gates templates/rbac.yaml (ServiceAccount + Role + RoleBinding). Separate
# from the config.GPU_WATCHDOG_ENABLED env var below: this one decides whether
# the RBAC objects exist at all, that one decides whether the process does
# anything once running. Both are on in-cluster; turn this off and the
# watchdog's pod will start but fail its delete calls with a 403.
gpuWatchdog:
  enabled: true

# Every consumer's env. This ConfigMap is what turns one docpipeline image into
# the 9 single-purpose Deployments below.
#
# Postgres/Redpanda/fake-gcs-server/Redis run in-cluster (templates/infra.yaml,
# wave -1), litellm/langfuse come from the sibling repo's stack; all reached by
# cluster DNS. e2e-k8s-only -- host-mode `make e2e` uses docker-compose and
# shares no infrastructure or ledger with this path.
config:
  PGHOST: "postgres.default.svc.cluster.local"
  PGPORT: "5432"
  PGDATABASE: "docpipeline"
  PIPELINE_RW_USER: "pipeline_rw"
  PIPELINE_RW_PASSWORD: "pipeline_rw_pw"
  PIPELINE_RO_USER: "pipeline_ro"
  PIPELINE_RO_PASSWORD: "pipeline_ro_pw"

  KAFKA_BOOTSTRAP_SERVERS: "redpanda.default.svc.cluster.local:9092"
  # Off by default in config.py -- only meaningful where a KEDA-scaled
  # Deployment's replicas can restart simultaneously and join the same
  # consumer group at once (see AGENT.md's "Known open bugs" #1).
  KAFKA_JOIN_JITTER_SECONDS: "8"

  STORAGE_EMULATOR_HOST: "http://fake-gcs-server.default.svc.cluster.local:4443"
  GCS_BUCKET: "docpipeline-local"
  GOOGLE_CLOUD_PROJECT: "local-project"

  REDIS_URL: "redis://redis.default.svc.cluster.local:6379/0"

  OCR_ENGINE: "mock"
  # Must be GCS: the fixtures Job writes this and ocr-shard reads it, and they
  # are different pods. A local path leaves ocr-shard reading the stale copy
  # baked into the image (AGENT.md bug #9).
  MOCK_OCR_REGISTRY_URI: "gs://docpipeline-local/fixtures/mock_ocr_registry.json"
  OCR_DPI: "150"

  SHARD_SIZE_PAGES: "1"
  HARD_PAGE_CEILING: "20"
  SWEEPER_BATCH_CAP: "5"
  SWEEPER_CADENCE_SECONDS: "30"
  STUCK_THRESHOLD_SECONDS: "30"
  RELAY_POLL_SECONDS: "2"
  RELAY_BATCH_CAP: "50"
  ORPHAN_DETECTOR_INTERVAL_SECONDS: "10"

  # Real in-cluster (litellm's reachable via DNS here); make e2e (host-only)
  # still defaults to mock in config.py for its fast ~15s loop. Flip back:
  #   kubectl set env deployment/docpipeline-extraction EXTRACTION_MODE=mock
  EXTRACTION_MODE: "real"
  LITELLM_BASE_URL: "http://litellm.default.svc.cluster.local:4000"
  LITELLM_MASTER_KEY: "sk-demo-key"

  # Same demo keys mlops-llm-repo/k8s/litellm.yaml already uses server-side
  # (same Langfuse project) — llm_client.push_gate_scores() attaches this
  # repo's own gate outcomes to the trace litellm already created.
  LANGFUSE_HOST: "http://langfuse-web.langfuse.svc.cluster.local:3000"
  LANGFUSE_PUBLIC_KEY: "pk-lf-demo-local-0000"
  LANGFUSE_SECRET_KEY: "sk-lf-demo-local-0000"

  # GPU watchdog (see the gpu-watchdog service below and AGENT.md's bug #2).
  # Off in config.py's own default because host-mode `make e2e` runs mock
  # extraction with no ollama at all; on here, same pattern as EXTRACTION_MODE.
  GPU_WATCHDOG_ENABLED: "1"
  OLLAMA_BASE_URL: "http://ollama.default.svc.cluster.local:11434"
  # Must stay in sync with LITELLM_TIER_MODELS in config.py, which maps
  # cheap->cheap-fast->llama3.2:1b and strong->cheap-balanced->qwen2.5:1.5b via
  # mlops-llm-repo/k8s/litellm.yaml. Both are pinned, not just the cheap tier:
  # a strong-tier escalation that cold-loads its model is another chance to
  # land on CPU, mid-pipeline.
  OLLAMA_MODELS: "llama3.2:1b,qwen2.5:1.5b"
  GPU_WATCHDOG_INTERVAL_SECONDS: "30"
  GPU_WATCHDOG_RESTART_COOLDOWN_SECONDS: "300"

# One Deployment per consumer group: topics are cheap, deployments cost ops.
# `name` becomes the Deployment/container
# name as docpipeline-<name>, so it must match the label selectors ansible's
# docpipeline_apps var and keda.yaml's scaleTargetRefs already expect.
services:
  - name: triage
    command: ["python", "-m", "docpipeline.stages.triage_1"]
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 200m, memory: 256Mi}
    # triage_1.py's TRIAGE_RESULTS counter — scraped by templates/monitoring.yaml's
    # Prometheus, one counter labeled by classification (dispatched, and every
    # zero_byte/unsupported_mime/encrypted/corrupt/page_ceiling/duplicate/not_found
    # failure reason), not one metric per failure mode.
    metricsPort: 9100

  - name: pdf-worker
    command: ["python", "-m", "docpipeline.stages.pdf_worker_2"]
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}

  # The ~900 CPU fleet in production, sized separately from pdf-worker for
  # kept separate deliberately -- see "Why not collapse further" in README.md.
  # KEDA scales this one on ocr.shard consumer lag (see keda section below).
  - name: ocr-shard
    command: ["python", "-m", "docpipeline.stages.ocr_shard_3"]
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 200m, memory: 256Mi}

  # KEDA scales this on ocr.completed lag (see keda section below).
  #
  # staleSeconds 300 = the 200s LITELLM_TIMEOUT_SECONDS call bound + 100s for
  # schema validation, gates and commits. This only works because
  # extraction_4.py touches /tmp/heartbeat *before and after* every model call,
  # so staleness tracks one bounded call rather than the whole 1200s message
  # budget. Remove either touch and this has to grow to the budget instead.
  - name: extraction
    command: ["python", "-m", "docpipeline.stages.extraction_4"]
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    livenessProbe:
      staleSeconds: 300

  - name: sink-stub
    command: ["python", "-m", "docpipeline.stages.sink_stub_5"]
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}

  # Fixed 2+ replicas, safe concurrently via SKIP LOCKED — see "Plus
  # outbox-relay, which sits outside that [scaling] table because it scales
  # on neither axis". On the critical path for every message; a
  # PodDisruptionBudget would matter at real scale, skipped here.
  - name: outbox-relay
    command: ["python", "-m", "docpipeline.core.outbox"]
    replicas: 2
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}

  - name: sweeper
    command: ["python", "-m", "docpipeline.reconciliation.sweeper"]
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}

  # Locally, this *is* the ingest path — see "Locally, the orphan detector is
  # the ingest path" (fake-gcs-server has no bucket-notification wiring).
  - name: orphan-detector
    command: ["python", "-m", "docpipeline.reconciliation.orphan_detector_0"]
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}

  # Keeps ollama's models pinned in VRAM and restarts the ollama pod when it
  # has silently fallen back to CPU (AGENT.md's "Known open bugs" #2). Lives
  # here, not in the sibling mlops-llm-repo's ollama.yaml, because this repo
  # deliberately doesn't edit that repo's manifests — see the module docstring.
  # The only service with a serviceAccountName (templates/rbac.yaml).
  - name: gpu-watchdog
    command: ["python", "-m", "docpipeline.reconciliation.gpu_watchdog"]
    replicas: 1
    serviceAccountName: docpipeline-gpu-watchdog
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}

# Scales the two lag-bound deployments: ocr-shard (~900 CPU
# fleet in prod) and extraction (token-quota bound in prod). lagThreshold: "1"
# is artificially low so a local burst actually demonstrates scale-up.
keda:
  kafkaBootstrapServers: "redpanda.default.svc.cluster.local:9092"
  scaledObjects:
    - name: ocr-shard
      target: docpipeline-ocr-shard
      minReplicaCount: 1
      maxReplicaCount: 5
      consumerGroup: ocr-shard
      topic: ocr.shard
    # Restored to 3 on 2026-08-31, lifting the workaround cap of 1 that had
    # stood since 2026-08-30 -- on the strength of a deliberate forced-CPU
    # reproduction under 3 replicas (zero restarts), not a healthy-GPU run,
    # which cannot exercise the bug at all. See AGENT.md's "Known open bugs" #1.
    - name: extraction
      target: docpipeline-extraction
      minReplicaCount: 1
      maxReplicaCount: 3
      consumerGroup: extraction
      topic: ocr.completed
