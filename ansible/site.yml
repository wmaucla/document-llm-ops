---
# document-llm-ops — infra + deployment orchestration.
# Run via `make <target>` (see Makefile) or directly:
#   ansible-playbook site.yml --tags reset
#   ansible-playbook site.yml --tags e2e
# See AGENT.md for the "why" behind non-obvious task ordering and fixes below.
- name: document-llm-ops
  hosts: local
  connection: local
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/.."
    sibling_repo_root: "{{ repo_root }}/../mlops-llm-repo"
    dotenv_cmd: "set -a && . ./.env && set +a &&"
    docpipeline_apps: >-
      app in (docpipeline-triage,docpipeline-pdf-worker,docpipeline-ocr-shard,
      docpipeline-extraction,docpipeline-sink-stub,docpipeline-outbox-relay,
      docpipeline-sweeper,docpipeline-orphan-detector,docpipeline-gpu-watchdog)
    pg_host: "{{ lookup('ansible.builtin.env', 'PGHOST') | default('localhost', true) }}"
    pg_port: "{{ lookup('ansible.builtin.env', 'PGPORT') | default('55432', true) }}"
    pg_database: "{{ lookup('ansible.builtin.env', 'PGDATABASE') | default('docpipeline', true) }}"
    pg_user: "{{ lookup('ansible.builtin.env', 'PGUSER') | default('postgres', true) }}"
    pg_password: "{{ lookup('ansible.builtin.env', 'PGPASSWORD') | default('postgres', true) }}"

  environment:
    PGHOST: "{{ pg_host }}"
    PGPORT: "{{ pg_port }}"
    PGDATABASE: "{{ pg_database }}"
    PGUSER: "{{ pg_user }}"
    PGPASSWORD: "{{ pg_password }}"

  tasks:
    # ══════════════════════════════════════════════════ up / down ══════
    # Plain `docker compose` CLI, not the community.docker collection module
    # — an older, incompatible community.docker version wins resolution on
    # this box's collection search path.
    - name: Start docker-compose infra (Postgres/Redpanda/fake-gcs-server/Redis)
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ repo_root }}"
      changed_when: true
      tags: [up, reset, e2e]

    - name: Wait for postgres + redpanda to report healthy
      ansible.builtin.command:
        cmd: "docker compose ps {{ item }} --format '{% raw %}{{.Health}}{% endraw %}'"
        chdir: "{{ repo_root }}"
      register: health_check
      until: health_check.stdout == "healthy"
      retries: 30
      delay: 1
      changed_when: false
      loop: [postgres, redpanda]
      tags: [up, reset, e2e]

    - name: Stop docker-compose infra
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ repo_root }}"
      changed_when: true
      tags: [down]

    # ══════════════════════════════════════════════════ init-db ════════
    - name: Apply migrations in order
      ansible.builtin.command:
        cmd: >
          psql -v ON_ERROR_STOP=1
          -h {{ pg_host }} -p {{ pg_port }} -U {{ pg_user }} -d {{ pg_database }}
          -f {{ item }}
      loop: "{{ query('ansible.builtin.fileglob', repo_root + '/migrations/*.sql') | sort }}"
      changed_when: true
      tags: [init-db, reset, e2e]

    # ══════════════════════════════════════════════════ reset ══════════
    # Truncate the ledger, clear GCS, recreate Redpanda, flush Redis. Must
    # run before topics/fixtures below and after migrations — file order is
    # execution order regardless of --tags (see AGENT.md).
    - name: Truncate ledger tables and reset the auto-post flag
      ansible.builtin.command:
        cmd: >
          psql -v ON_ERROR_STOP=1 -h {{ pg_host }} -p {{ pg_port }}
          -U {{ pg_user }} -d {{ pg_database }} -c
          "TRUNCATE documents, document_shards, outbox, attempt_log,
          posted_documents, break_glass_audit RESTART IDENTITY CASCADE;
          UPDATE feature_flags SET value = true WHERE key = 'auto_post_enabled';"
      changed_when: true
      tags: [reset]

    - name: Clear GCS objects (inbox/, ocr/, shards/, shards_out/, experiments/)
      ansible.builtin.shell:
        cmd: >
          {{ dotenv_cmd }} uv run python3 -c
          "from docpipeline.infra import gcs;
          gcs.ensure_bucket();
          [gcs.delete_prefix(p) for p in ('inbox/','ocr/','shards/','shards_out/','experiments/')]"
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: true
      tags: [reset]

    - name: Recreate Redpanda (new container = wiped topics/offsets/groups)
      ansible.builtin.command: "{{ item }}"
      loop:
        - "docker compose kill redpanda"
        - "docker compose rm -f redpanda"
        - "docker compose up -d redpanda"
      args:
        chdir: "{{ repo_root }}"
      changed_when: true
      failed_when: false
      tags: [reset]

    - name: Wait for the recreated Redpanda to report healthy
      ansible.builtin.command:
        cmd: "docker compose ps redpanda --format '{% raw %}{{.Health}}{% endraw %}'"
        chdir: "{{ repo_root }}"
      register: rp_health
      until: rp_health.stdout == "healthy"
      retries: 30
      delay: 1
      changed_when: false
      tags: [reset]

    - name: Flush Redis
      ansible.builtin.shell:
        cmd: >
          {{ dotenv_cmd }} uv run python3 -c
          "import redis; from docpipeline import config;
          redis.from_url(config.REDIS_URL).flushdb()"
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: true
      tags: [reset]

    - name: Clear local mock-OCR registry, fixture manifest, and per-service logs
      ansible.builtin.shell:
        cmd: "rm -f fixtures/generated/mock_ocr_registry.json fixtures/generated/manifest.json logs/*.log"
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: true
      tags: [reset]

    # ══════════════════════════════════════════════════ topics ═════════
    # One shared, idempotent task — runs standalone on a fresh broker
    # (`--tags topics`) or right after reset's redpanda recreation
    # (`--tags reset`), always after any redpanda (re)start.
    - name: Create every Kafka topic
      ansible.builtin.shell:
        cmd: "{{ dotenv_cmd }} uv run python3 local_scripts/create_topics.py"
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: true
      tags: [topics, reset, e2e]

    # ══════════════════════════════════════════════════ fixtures ═══════
    - name: Generate + upload the 14 fixtures
      ansible.builtin.shell:
        cmd: "{{ dotenv_cmd }} uv run python3 fixtures/generate_fixtures.py"
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: true
      tags: [fixtures, e2e]

    # e2e-k8s's own fixture upload, topic creation, and migrations run
    # in-cluster (see the new block after the GPU self-heal section below) —
    # they need the freshly-rebuilt cluster and its in-cluster infra to exist
    # first, so they can't live here alongside the host-mode fixtures task
    # above despite doing the conceptually equivalent thing.

    # ══════════════════════════════════════════════════ cluster-rebuild ═
    # DESTRUCTIVE: deletes whatever minikube cluster currently exists,
    # sibling-repo stack included, every e2e-k8s run — a genuinely
    # clean-room cluster is worth the ~10-15 min cost (see AGENT.md's
    # "stale Kafka clients" and "cluster rebuild" notes for why). Runs the
    # sibling mlops-llm-repo's own `terraform apply` rather than
    # reimplementing its ArgoCD/Ollama/LiteLLM/Langfuse bring-up here.
    - name: Delete any existing minikube cluster
      ansible.builtin.command:
        cmd: minikube delete
      changed_when: true
      failed_when: false
      tags: [cluster-rebuild, e2e-k8s]

    # --gpus=all requires the NVIDIA Container Toolkit on the host (docker driver +
    # docker container-runtime only) — passes the host GPU through so the sibling
    # repo's ollama.yaml can request nvidia.com/gpu and run real inference in
    # seconds instead of minutes. Confirmed live: CPU-only inference for these
    # ~1-1.5B models was highly host-load-dependent (150s-7.5min/call under
    # contention) — this is the actual fix for that, not more SLO tuning.
    - name: Start a fresh minikube cluster (sized for both stacks sharing it, GPU passthrough enabled)
      ansible.builtin.command:
        cmd: minikube start --cpus=6 --memory=20480 --gpus=all
      changed_when: true
      tags: [cluster-rebuild, e2e-k8s]

    # Stale local tfstate survives `minikube delete` and would make terraform
    # skip re-applying against the fresh cluster.
    - name: Clear the sibling repo's stale terraform state
      ansible.builtin.file:
        path: "{{ sibling_repo_root }}/tf/{{ item }}"
        state: absent
      loop:
        - .terraform
        - terraform.tfstate
        - terraform.tfstate.backup
      tags: [cluster-rebuild, e2e-k8s]

    # Ansible's chdir (not terraform's own -chdir flag) is required: asdf's
    # terraform shim resolves its version from the nearest .tool-versions
    # relative to the OS working directory, which -chdir never changes.
    # Without this, it resolves ~/.tool-versions instead of the sibling
    # repo's own pinned version and fails on its version constraint.
    - name: Re-provision the sibling repo's entire stack (ArgoCD, Argo Workflows, Ollama, LiteLLM, Langfuse) via its own terraform
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ sibling_repo_root }}/tf"
      loop:
        - "terraform init"
        - "terraform apply -auto-approve"
      changed_when: true
      tags: [cluster-rebuild, e2e-k8s]

    # ══════════════════════════════════════════════════ GPU self-heal ══
    # Two problems, both fixed by patching the live Deployment because this repo
    # deliberately does not edit the sibling's ollama.yaml (AGENT.md bug #2):
    # OLLAMA_KEEP_ALIVE defaults to 5 minutes, so every idle gap unloads a model
    # and re-runs ggml_cuda_init -- another chance to land on CPU; and when that
    # does fail, ollama serves from CPU while staying Ready (0.079s -> 150-450s).
    #
    # These steps make the deploy deterministic. The gpu-watchdog Deployment
    # then enforces the same invariants continuously, which a one-shot
    # deploy-time check never covered.
    - name: Wait for ollama to be fully available (models pulled) before touching it
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=available deployment/ollama --timeout=300s
      changed_when: false
      tags: [cluster-rebuild, e2e-k8s]

    # memory: 4Gi was not enough for both models resident at once — ollama's own
    # loader logged `disabling mmap for llama-server load due to host memory
    # pressure` with `system_free="768.2 MiB" system_total="4.0 GiB"`. The
    # CUDA_Host pinned buffers count against the cgroup even though the tensors
    # are in VRAM, so this is host RAM, not a VRAM shortage (the 2080 Ti has
    # 10.6 GiB and the two models need ~2.8 GiB of it).
    - name: Pin ollama's models in VRAM and give it room for both (patches the live Deployment; mlops-llm-repo's manifest is not edited)
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl set env deployment/ollama OLLAMA_KEEP_ALIVE=-1 OLLAMA_MAX_LOADED_MODELS=2
          kubectl set resources deployment/ollama --limits=memory=8Gi --requests=memory=2Gi
        executable: /bin/bash
      changed_when: true
      tags: [cluster-rebuild, e2e-k8s]

    # `kubectl set env`/`set resources` each trigger a rollout. ollama.yaml uses
    # strategy: Recreate (there is exactly one nvidia.com/gpu on this node, so a
    # surge-then-kill rollout would deadlock), so there is a window with no
    # ollama pod at all — wait it out before warming.
    - name: Wait for the patched ollama rollout to settle
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl rollout status deployment/ollama --timeout=600s
          kubectl wait --for=condition=available deployment/ollama --timeout=600s
        executable: /bin/bash
      changed_when: false
      tags: [cluster-rebuild, e2e-k8s]

    # Warm *both* tiers' models, not just the cheap one. The funnel escalates
    # cheap -> strong, so a strong-tier call that has to cold-load qwen2.5:1.5b
    # is another ggml_cuda_init — previously that one ran for the first time
    # mid-pipeline, unwarmed and unverified. With OLLAMA_KEEP_ALIVE=-1 set
    # above, `ollama run` inherits it and each model stays resident for the
    # pod's lifetime rather than unloading after the default 5 minutes.
    #
    # `ollama run` (the CLI inside the image) rather than an HTTP call: the
    # ollama image ships no curl or wget, confirmed live —
    # `exec: "curl": executable file not found in $PATH`.
    - name: Warm both tiers' models through ollama's real inference path
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          for m in llama3.2:1b qwen2.5:1.5b; do
            kubectl exec deploy/ollama -- ollama run "$m" hi
          done
        executable: /bin/bash
      changed_when: false
      tags: [cluster-rebuild, e2e-k8s]

    # The actual GPU verification now lives after the docpipeline deploy, in
    # the "GPU residency gate" block below — it runs `gpu_watchdog --check-once`
    # inside the gpu-watchdog pod, which is the same code that then enforces
    # this continuously. Nothing here parses ollama's logs or CLI output any
    # more. See that block for why the old check could never have worked.

    # ══════════════════════════════════════════════════ image ══════════
    - name: Build the docpipeline image into minikube's docker daemon
      ansible.builtin.shell:
        cmd: |
          eval $(minikube docker-env)
          docker build -t docpipeline:latest .
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: true
      tags: [image, e2e-k8s]

    # ══════════════════════════════════════════════════ deploy (ArgoCD) ═
    # Infra (templates/infra.yaml, wave -1) and the migrate/topics/fixtures Jobs
    # (templates/jobs.yaml, wave 0) are part of this same Application and sync.
    # ArgoCD's sync-wave health-gating is what orders "infra up -> schema/topics/
    # fixtures exist -> app tier starts", so there is no ansible orchestration of
    # it. The two Application applies below are the only raw k8s-API calls left
    # in this play, and are irreducible: ArgoCD can't sync the object that tells
    # it what to sync.
    - name: Apply the docpipeline ArgoCD Application
      kubernetes.core.k8s:
        state: present
        src: "{{ repo_root }}/argocd/application.yaml"
      tags: [deploy, e2e-k8s]

    - name: Apply the KEDA ArgoCD Application
      kubernetes.core.k8s:
        state: present
        src: "{{ repo_root }}/argocd/keda-application.yaml"
      tags: [keda-install, e2e-k8s]

    # `--core` talks to the Kubernetes API directly (no argocd-server
    # login/port-forward at all) — confirmed live as the fix for a
    # port-forward that reliably died after its first connection when
    # backgrounded from an Ansible shell task, no matter how it was
    # detached (nohup, setsid, retries). It resolves argocd-cm from the
    # *current kubectl context's namespace*, hence the explicit switch
    # and reset around it — nothing else in this play may assume "argocd"
    # is the ambient default namespace.
    - name: Point the kubectl context at the argocd namespace for --core mode
      ansible.builtin.command:
        cmd: kubectl config set-context --current --namespace=argocd
      changed_when: false
      tags: [keda-install, deploy, e2e-k8s]

    - name: Sync the KEDA Application from its upstream Helm chart
      ansible.builtin.command:
        cmd: "argocd app sync keda --core"
      changed_when: true
      tags: [keda-install, e2e-k8s]

    - name: Wait for the KEDA operator to become available
      ansible.builtin.command:
        cmd: "kubectl wait --for=condition=available deployment -l app.kubernetes.io/name=keda-operator -n keda --timeout=90s"
      changed_when: false
      tags: [keda-install, e2e-k8s]

    # Operator Available != CRDs usable, and neither means ArgoCD knows about
    # them -- it caches the cluster's API resource list, so a new CRD is
    # invisible to a sync until that refreshes. This closes the CRD half; the
    # sync below retries for the discovery-cache half.
    - name: Wait for KEDA's CRDs to be established
      ansible.builtin.command:
        cmd: "kubectl wait --for=condition=established crd/scaledobjects.keda.sh crd/scaledjobs.keda.sh --timeout=90s"
      changed_when: false
      tags: [keda-install, e2e-k8s]

    # --timeout 480: this now blocks through the full sync-wave sequence
    # (infra healthy -> setup Jobs succeed -> app tier healthy), not just a
    # flat apply, so it needs real margin instead of the CLI's default of
    # waiting indefinitely (a stuck wave would otherwise hang this task, and
    # the whole play, forever with no failure signal).
    # Retries the transient "no matches for kind ScaledObject" a fresh KEDA
    # install can produce (see the CRD wait above). Bounded on purpose: any
    # other sync failure still fails the run once attempts are exhausted.
    - name: Sync the docpipeline Application from the local k8s/ tree
      ansible.builtin.command:
        cmd: "argocd app sync docpipeline --core --local {{ repo_root }}/k8s --timeout 480"
      register: docpipeline_sync
      until: docpipeline_sync.rc == 0
      retries: 3
      delay: 20
      changed_when: true
      tags: [deploy, e2e-k8s]

    - name: Reset the kubectl context back to the default namespace
      ansible.builtin.command:
        cmd: kubectl config set-context --current --namespace=default
      changed_when: false
      tags: [keda-install, deploy, e2e-k8s]

    - name: Wait for every docpipeline Deployment to become available
      ansible.builtin.command:
        cmd: "kubectl wait --for=condition=available deployment -l '{{ docpipeline_apps }}' -n default --timeout=90s"
      changed_when: false
      tags: [deploy, e2e-k8s]

    # reset recreates Redpanda (new cluster ID); pods from a prior deploy
    # keep their old Kafka client and `argocd app sync` won't restart an
    # unchanged Deployment. Force a reconnect rather than wait out
    # librdkafka's own recovery (observed ~14 min — see AGENT.md).
    - name: Roll every docpipeline Deployment so Kafka clients reconnect to the (possibly just-recreated) Redpanda cluster
      ansible.builtin.command:
        cmd: "kubectl rollout restart deployment -l '{{ docpipeline_apps }}' -n default"
      changed_when: true
      tags: [deploy, e2e-k8s]

    - name: Wait for the rollout restart to finish
      ansible.builtin.command:
        cmd: "kubectl rollout status deployment/{{ item }} -n default --timeout=90s"
      loop:
        - docpipeline-triage
        - docpipeline-pdf-worker
        - docpipeline-ocr-shard
        - docpipeline-extraction
        - docpipeline-sink-stub
        - docpipeline-outbox-relay
        - docpipeline-sweeper
        - docpipeline-orphan-detector
        - docpipeline-gpu-watchdog
      changed_when: false
      tags: [deploy, e2e-k8s]

    # `kubectl rollout status` only confirms pods are Ready, not that the
    # Kafka consumer group's rebalance has settled. Confirmed live: a
    # canary run immediately after this rollout restart got its message
    # stranded mid-rebalance (3 replicas restarting within ~7s) — never
    # consumed until the sweeper redrove it ~4 minutes later. Pausing here
    # lets the group stabilize before anything depends on it consuming.
    - name: Let the Kafka consumer group rebalance settle after the restart
      ansible.builtin.pause:
        seconds: 20
      tags: [deploy, e2e-k8s]

    # ══════════════════════════════════════════════ GPU residency gate ══
    # Asserts both models are resident in *VRAM*, not merely loaded, failing the
    # play rather than running the whole pipeline on CPU. Runs the same code the
    # gpu-watchdog runs continuously, so gate and enforcement cannot disagree
    # about what "on the GPU" means.
    #
    # Two constraints worth keeping: this must assert residency *positively* --
    # the check it replaced used `grep -qv PAT || exit 1`, which passes whenever
    # any line fails to match and so never once fired. And it must run from a
    # docpipeline pod, not ollama's, which ships no curl or wget.
    - name: Wait for the GPU watchdog to be ready
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/docpipeline-gpu-watchdog -n default --timeout=90s
      changed_when: false
      tags: [deploy, e2e-k8s]

    - name: Gate on ollama actually being GPU-resident (heals once, then fails the play rather than running the whole pipeline on CPU)
      ansible.builtin.command:
        cmd: >-
          kubectl exec deploy/docpipeline-gpu-watchdog -n default --
          python -m docpipeline.reconciliation.gpu_watchdog --check-once --timeout 600
      changed_when: false
      tags: [deploy, e2e-k8s]

    # Cascade delete goes through ArgoCD, not raw kubectl — the Application
    # owns every resource it synced from k8s/ (configmap, deployments,
    # ScaledObjects in keda.yaml included), so this is the GitOps-native
    # mirror of the "deploy" sync above, not a separate manual teardown list.
    - name: Remove everything the deploy tag created (ArgoCD cascade delete)
      ansible.builtin.shell:
        cmd: |
          kubectl config set-context --current --namespace=argocd
          argocd app delete docpipeline --core --cascade --yes
          kubectl config set-context --current --namespace=default
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [undeploy, never]

    # ══════════════════════════════════════════════════ canary / dlq / deadman ═
    # All three exec into docpipeline-triage (stable, always-1-replica, never
    # KEDA-scaled) because Postgres/Kafka/GCS aren't host-reachable in-cluster.
    #
    # 900s SLO rather than the CLI's 60s default: a CPU-only Ollama call is
    # host-load-dependent, observed from ~150s to 7.5 minutes for one call.
    # FIXTURE_LIMIT=4 fixes contention *between* documents; this is separate
    # margin for raw inference speed, which pipeline-side tuning can't control.
    # --extraction-mode real is load-bearing, not cosmetic -- canary.py can't
    # infer real-vs-mock from ambient env, and without it wrongly fails a run
    # that legitimately landed in `review`.
    - name: Run the synthetic canary
      ansible.builtin.command:
        cmd: "kubectl exec deploy/docpipeline-triage -- python -m docpipeline.reconciliation.canary --slo-seconds 900 --extraction-mode real"
      changed_when: false
      tags: [canary, e2e-k8s]

    # Both echo their output for the same reason the summaries do: ansible's
    # default callback swallows it, and "ok" alone tells you nothing about what
    # the reconciliation lane actually found. dlq_replay is a no-op on a healthy
    # run (nothing in `failed`), which is itself the thing worth seeing.
    - name: Re-drive failed docs whose build_sha/prompt_version changed
      ansible.builtin.command:
        cmd: "kubectl exec deploy/docpipeline-triage -- python -m docpipeline.reconciliation.dlq_replay"
      register: dlq_replay_result
      changed_when: false
      tags: [dlq-replay, verify-extras]

    - name: Show the DLQ replay result
      ansible.builtin.debug:
        msg: "{{ dlq_replay_result.stdout_lines | default(['(no output)']) }}"
      tags: [dlq-replay, verify-extras]

    # Exits non-zero if the pipeline has been totally silent for
    # DEADMANS_SWITCH_WINDOW_SECONDS. Run last in verify-loop, where documents
    # have just settled, so silence there is a real failure rather than an idle
    # cluster -- do not move it ahead of the drain.
    - name: Report on documents sitting in failed
      ansible.builtin.command:
        cmd: "kubectl exec deploy/docpipeline-triage -- python -m docpipeline.reconciliation.failed_report"
      register: failed_report_result
      changed_when: false
      tags: [failed-report]

    - name: Show the failed-state report
      ansible.builtin.debug:
        msg: "{{ failed_report_result.stdout_lines | default(['(no output)']) }}"
      tags: [failed-report]

    - name: Check for total silence (dead man's switch)
      ansible.builtin.command:
        cmd: "kubectl exec deploy/docpipeline-triage -- python -m docpipeline.reconciliation.deadmans_switch"
      register: deadmans_result
      failed_when: false
      changed_when: false
      tags: [deadmans-switch, verify-extras]

    - name: Show the dead man's switch result
      ansible.builtin.debug:
        msg: "{{ deadmans_result.stdout_lines | default(['(no output)']) }}"
      tags: [deadmans-switch, verify-extras]

    - name: Fail if the dead man's switch reports the pipeline unhealthy
      ansible.builtin.fail:
        msg: "dead man's switch reported unhealthy (rc={{ deadmans_result.rc }}) — see the output above"
      when: deadmans_result.rc != 0
      tags: [deadmans-switch, verify-extras]

    # Standalone -- not part of e2e-k8s's own tag list. Assumes the cluster
    # is already up (no deploy/build steps here); just injects fresh
    # documents and returns immediately, for repeatedly exercising a live
    # cluster (KEDA scaling, the extraction liveness probe, sweeper redrive)
    # without paying for a full teardown/rebuild each time.
    - name: Replay N fresh synthetic documents into the running cluster
      ansible.builtin.command:
        cmd: "kubectl exec deploy/docpipeline-triage -- python local_scripts/replay_docs.py --count {{ replay_count | default(3) }}"
      changed_when: true
      tags: [replay]

    # ══════════════════════════════════════════════════ e2e (host/mock) ═
    # This section and test/summary after it must stay physically last:
    # file order is execution order regardless of --tags, and e2e needs
    # consumers drained before pytest's TRUNCATE fixture runs.
    - name: Start all consumers as host processes
      # Exec the venv interpreter directly, not `uv run` — uv forks rather
      # than exec's, so $! would capture uv's wrapper PID, not the real one
      # (see AGENT.md's PID-capture gotcha).
      ansible.builtin.shell:
        cmd: >
          ( {{ dotenv_cmd }} exec {{ repo_root }}/.venv/bin/python3 local_scripts/run_local.py )
          > /tmp/docpipeline_e2e.log 2>&1 & echo $! > /tmp/docpipeline_e2e.pid
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: true
      tags: [e2e]

    - name: Give the consumers a moment to subscribe before polling
      ansible.builtin.pause:
        seconds: 5
      tags: [e2e]

    - name: Wait for every document to reach a terminal state
      ansible.builtin.shell:
        cmd: "{{ dotenv_cmd }} uv run python3 local_scripts/wait_for_drain.py 180"
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      register: drain_result
      failed_when: false
      changed_when: false
      tags: [e2e]

    # Every document already reached a terminal state per the drain check
    # above, so there's nothing in-flight left to protect — a hard kill of
    # the whole process group (negative PID) is immediate and sufficient,
    # no graceful-then-poll needed. Still targets the group, not just the
    # parent PID, so run_local.py's own children don't leak as zombies
    # (see AGENT.md's PID-capture gotcha) — SIGKILL bypasses run_local.py's
    # SIGTERM handler entirely, so this can't rely on it to clean up children.
    - name: Stop the host consumers
      ansible.builtin.shell:
        cmd: |
          kill -9 -- "-$(cat /tmp/docpipeline_e2e.pid)" 2>/dev/null || true
          sleep 1
          kill -0 "$(cat /tmp/docpipeline_e2e.pid)" 2>/dev/null && echo still_running || echo stopped
        executable: /bin/bash
      register: stop_result
      changed_when: false
      tags: [e2e]

    # Catches a leaked consumer stack before it can straddle the next
    # reset/fixtures cycle (see AGENT.md's PID-capture gotcha).
    - name: Fail loudly if the host consumers did not actually stop
      ansible.builtin.fail:
        msg: "run_local.py (pidfile /tmp/docpipeline_e2e.pid) did not exit within 30s — check for leaked docpipeline.* processes with `ps aux | grep docpipeline`"
      when: "'still_running' in stop_result.stdout"
      tags: [e2e]

    - name: Fail loudly if the drain timed out
      ansible.builtin.fail:
        msg: "e2e (host/mock) FAILED to drain in time — see /tmp/docpipeline_e2e.log"
      when: drain_result.rc != 0
      tags: [e2e]

    # ══════════════════════════════════════════════════ test / summary ═
    # Physically last on purpose — see the note above the e2e section.
    # Same split as the in-cluster summary below: `--tags e2e` has already run
    # wait_for_drain, so in-flight there is a real failure; bare `make summary`
    # is a progress report against a possibly-live pipeline and must not fail.
    # Registered + echoed rather than run bare, same reason as the in-cluster
    # summary below — see the comment there.
    - name: Print the final per-document summary (host/mock)
      ansible.builtin.shell:
        cmd: >-
          {{ dotenv_cmd }} uv run python3 local_scripts/summarize.py
          {{ '--require-settled' if 'e2e' in ansible_run_tags else '' }}
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      register: host_summary_result
      failed_when: false
      changed_when: false
      tags: [summary, e2e]

    - name: Show the host/mock summary
      ansible.builtin.debug:
        msg: "{{ host_summary_result.stdout_lines }}"
      tags: [summary, e2e]

    - name: Fail if the host/mock run did not settle
      ansible.builtin.fail:
        msg: "summarize.py reported the run did not settle (rc={{ host_summary_result.rc }}) — see the table above"
      when: host_summary_result.rc != 0
      tags: [summary, e2e]

    # The canary above only blocks on its *own* one synthetic document — the
    # 4 real fixtures (FIXTURE_LIMIT=4) are dispatched earlier and happen to
    # be racing the canary for the same single Ollama pod, so they *often*
    # finish by the time the canary does, but that's incidental serialization,
    # not a guarantee. Without an explicit wait here, summarize.py below can
    # catch a fixture mid-flight (e.g. still working through a multi-round
    # schema repair loop) and now fails the whole play loudly for that —
    # confirmed live: exactly this happened once a document needed 3 repair
    # rounds. Same wait_for_drain.py the host path already uses, via kubectl
    # exec; its manifest.json fallback (stability across two consecutive
    # polls) is what actually applies here, since the Job that generates
    # fixtures.generated/manifest.json is a different, short-lived pod from
    # docpipeline-triage. 900s to match the canary's own SLO margin, not a
    # tighter guess.
    # Also tagged replay-wait so `make verify-loop` can reuse this exact task
    # after `make replay-docs` instead of duplicating it — same wait, same
    # fail-loudly guard, whether what's in-flight came from the initial
    # deploy's fixtures or from a later replay.
    - name: Wait for every document to reach a terminal state (in-cluster)
      ansible.builtin.command:
        cmd: "kubectl exec deploy/docpipeline-triage -- python local_scripts/wait_for_drain.py 900"
      register: k8s_drain_result
      failed_when: false
      changed_when: false
      tags: [e2e-k8s, replay-wait]

    - name: Fail loudly if the in-cluster drain timed out
      ansible.builtin.fail:
        msg: "e2e-k8s/replay FAILED to drain in time — {{ k8s_drain_result.stdout_lines[-1] | default('see kubectl logs deploy/docpipeline-extraction') }}"
      when: k8s_drain_result.rc != 0
      tags: [e2e-k8s, replay-wait]

    # Tagged separately from e2e-k8s so `make summary-k8s` is runnable standalone
    # at any point -- `make summary` is host-mode only and points at a different
    # database entirely, which is the confusion this target exists to avoid.
    #
    # --require-settled only at the end of an e2e run, where the drain-wait
    # above guarantees anything in-flight is a genuine failure. A standalone
    # summary must not fail on documents that are merely still working.
    #
    # Registered + echoed via debug because ansible's default callback swallows
    # command output; `failed_when: false` + the explicit fail below keeps the
    # table visible on a non-zero rc, which is when you most want it.
    - name: Print the final per-document summary (in-cluster)
      ansible.builtin.command:
        cmd: >-
          kubectl exec deploy/docpipeline-triage -- python local_scripts/summarize.py
          {{ '--require-settled' if 'e2e-k8s' in ansible_run_tags else '' }}
      register: k8s_summary_result
      failed_when: false
      changed_when: false
      tags: [e2e-k8s, summary-k8s]

    - name: Show the in-cluster summary
      ansible.builtin.debug:
        msg: "{{ k8s_summary_result.stdout_lines }}"
      tags: [e2e-k8s, summary-k8s]

    - name: Fail if the in-cluster run did not settle
      ansible.builtin.fail:
        msg: "summarize.py reported the run did not settle (rc={{ k8s_summary_result.rc }}) — see the table above"
      when: k8s_summary_result.rc != 0
      tags: [e2e-k8s, summary-k8s]

    # Mock-mode pytest correctness is already fully proven by make e2e's host
    # loop above — e2e-k8s only needs to prove the deployment mechanics and
    # real-LLM path (the canary), not re-run the whole suite. Running it
    # in-cluster too would mean bundling pytest + tests/ into the image and
    # wiring a full test session's worth of DB connections through kubectl
    # exec, for no additional correctness signal.
    - name: Run the pytest suite (mock mode)
      ansible.builtin.shell:
        cmd: "{{ dotenv_cmd }} uv run pytest tests/ -v --timeout=60 -k 'not real_llm'"
        chdir: "{{ repo_root }}"
        executable: /bin/bash
      changed_when: false
      tags: [test, e2e]
