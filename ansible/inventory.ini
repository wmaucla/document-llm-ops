# ansible_python_interpreter is pinned rather than left on "auto" because
# auto-discovery on this box picks an asdf shim for a Python version that
# was never actually `asdf install`ed. Point this at whichever python3 on
# your PATH has the `docker` and `kubernetes` packages importable
# (`python3 -c "import docker, kubernetes"`) if it differs from below.
[local]
localhost ansible_connection=local ansible_python_interpreter=/home/william/.asdf/shims/python3
